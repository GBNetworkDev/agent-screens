<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1e2330">
  <title>Agent Screen</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1e2330}
    body{display:flex}
    canvas{outline:none}
    #agent-command-header{position:fixed;z-index:30;top:max(8px,env(safe-area-inset-top));left:50%;width:min(520px,calc(100vw - 20px));transform:translateX(-50%);overflow:hidden;border:1px solid #ffffff2c;border-radius:17px;background:#0f172aeb;color:#f8fafc;box-shadow:0 12px 34px #0009;backdrop-filter:blur(15px);font-family:system-ui,-apple-system,sans-serif;transition:width .2s,border-radius .2s,opacity .15s}
    #screen-switcher{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-bottom:1px solid #ffffff1f}
    #screen-switcher a{display:grid;grid-template-columns:9px 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;min-height:50px;padding:7px 12px;border-radius:12px;color:#94a3b8;text-decoration:none;white-space:nowrap;touch-action:manipulation;transition:background .15s,color .15s,box-shadow .15s}
    .screen-link-dot{grid-row:1/3;width:8px;height:8px;border-radius:50%;background:#64748b;box-shadow:0 0 0 3px #64748b22;transition:opacity .15s,background .15s,box-shadow .15s}
    #screen-switcher a[data-screen="1"] .screen-link-dot{background:#8b5cf6;box-shadow:0 0 0 3px #8b5cf633}
    #screen-switcher a[data-screen="2"] .screen-link-dot{background:#0ea5e9;box-shadow:0 0 0 3px #0ea5e933}
    #screen-switcher a[data-screen="3"] .screen-link-dot{background:#22c55e;box-shadow:0 0 0 3px #22c55e33}
    #screen-switcher a[data-screen="4"] .screen-link-dot{background:#ec4899;box-shadow:0 0 0 3px #ec489933}
    #screen-switcher a:not([aria-current="page"]) .screen-link-dot{opacity:.72}
    .screen-link-name{font-size:13px;font-weight:800;line-height:1.1;letter-spacing:.02em}
    .screen-link-role{overflow:hidden;font-size:10px;font-weight:650;line-height:1.1;text-overflow:ellipsis}
    #screen-switcher a:hover,#screen-switcher a:focus-visible{background:#ffffff10;color:#fff;outline:none}
    #screen-switcher a[aria-current="page"]{background:linear-gradient(135deg,#334155,#1e3a8a);color:#fff;box-shadow:inset 0 0 0 1px #60a5fa45,0 5px 16px #0004}
    #screen-switcher a[data-screen="1"][aria-current="page"]{background:linear-gradient(135deg,#4c1d95,#312e81)}
    #screen-switcher a[data-screen="3"][aria-current="page"]{background:linear-gradient(135deg,#14532d,#164e63)}
    #screen-switcher a[data-screen="4"][aria-current="page"]{background:linear-gradient(135deg,#831843,#4c1d95)}
    #screen-switcher a[aria-current="page"] .screen-link-dot{background:#a5f3fc;box-shadow:0 0 0 3px #67e8f933}
    #screen-switcher a[data-screen="1"][aria-current="page"] .screen-link-dot{background:#c4b5fd;box-shadow:0 0 0 3px #c4b5fd33}
    #screen-switcher a[data-screen="3"][aria-current="page"] .screen-link-dot{background:#86efac;box-shadow:0 0 0 3px #86efac33}
    #screen-switcher a[data-screen="4"][aria-current="page"] .screen-link-dot{background:#f9a8d4;box-shadow:0 0 0 3px #f9a8d433}
    #agent-status{position:relative;display:grid;grid-template-columns:12px minmax(0,1fr) auto;grid-template-areas:"dot identity state" "dot task task" "dot meta meta";column-gap:10px;row-gap:4px;padding:12px 14px 13px}
    #agent-status-dot{grid-area:dot;align-self:start;width:10px;height:10px;margin-top:4px;border-radius:50%;background:#64748b;box-shadow:0 0 0 4px #64748b24}
    #agent-status-identity{grid-area:identity;min-width:0}
    #agent-status-name{font-size:14px;font-weight:800;line-height:1.15}
    #agent-status-role{margin-left:7px;color:#94a3b8;font-size:11px;font-weight:650}
    #agent-status-state{grid-area:state;align-self:start;padding:3px 7px;border:1px solid #64748b55;border-radius:999px;color:#94a3b8;font-size:9px;font-weight:850;line-height:1;text-transform:uppercase;letter-spacing:.08em}
    #agent-status-task{grid-area:task;overflow:hidden;color:#e2e8f0;font-size:12px;font-weight:600;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}
    #agent-status-meta{grid-area:meta;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-right:34px;color:#94a3b8;font-size:10px;font-weight:650;line-height:1.2}
    #agent-status-activity{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #screen-connection{display:flex;align-items:center;gap:5px;flex:none}
    #screen-connection::before{content:"";width:6px;height:6px;border-radius:50%;background:#f59e0b}
    #agent-command-header[data-connection="live"] #screen-connection{color:#86efac}
    #agent-command-header[data-connection="live"] #screen-connection::before{background:#22c55e}
    #agent-command-header[data-connection="reconnecting"] #screen-connection{color:#fcd34d}
    #agent-command-header[data-state="idle"] #agent-status-dot{background:#22c55e;box-shadow:0 0 0 4px #22c55e24}
    #agent-command-header[data-state="working"] #agent-status-dot{background:#3b82f6;box-shadow:0 0 0 4px #3b82f624;animation:status-pulse 1.8s ease-out infinite}
    #agent-command-header[data-state="waiting_approval"] #agent-status-dot{background:#f59e0b;box-shadow:0 0 0 4px #f59e0b24}
    #agent-command-header[data-state="error"] #agent-status-dot{background:#ef4444;box-shadow:0 0 0 4px #ef444424}
    #agent-command-header[data-state="offline"] #agent-status-dot{background:#64748b;box-shadow:0 0 0 4px #64748b24}
    #agent-header-toggle{position:absolute;right:0;bottom:0;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#94a3b8;font:800 15px/1 system-ui;cursor:pointer;touch-action:manipulation}
    #agent-header-toggle:hover,#agent-header-toggle:focus-visible{background:#ffffff12;color:#fff;outline:none}
    #agent-command-header[data-collapsed="true"]{width:min(330px,calc(100vw - 20px));border-radius:15px}
    #agent-command-header[data-collapsed="true"] #screen-switcher{display:none}
    #agent-command-header[data-collapsed="true"] #agent-status{grid-template-columns:10px minmax(0,1fr) auto;grid-template-areas:"dot identity state";align-items:center;padding:10px 40px 10px 13px}
    #agent-command-header[data-collapsed="true"] #agent-status-dot{align-self:center;margin-top:0}
    #agent-command-header[data-collapsed="true"] #agent-status-role,#agent-command-header[data-collapsed="true"] #agent-status-task,#agent-command-header[data-collapsed="true"] #agent-status-meta{display:none}
    #agent-command-header[data-collapsed="true"] #agent-header-toggle{bottom:0;transform:rotate(180deg)}
    @keyframes status-pulse{0%{box-shadow:0 0 0 0 #3b82f677}70%{box-shadow:0 0 0 7px #3b82f600}100%{box-shadow:0 0 0 0 #3b82f600}}
    #mobile-keyboard{position:fixed;z-index:20;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;font:600 14px/1 system-ui,-apple-system,sans-serif}
    #mobile-keyboard button{min-height:44px;border:1px solid #ffffff2c;border-radius:12px;padding:0 14px;background:#111827e8;color:#f8fafc;box-shadow:0 8px 24px #0008;touch-action:manipulation}
    #mobile-keyboard-button,#mobile-pointer-button,#mobile-clipboard-button{display:grid;place-items:center;width:48px;height:44px;min-width:48px;min-height:44px;border:1px solid #ffffff2c;border-radius:12px;padding:0;background:#111827e8;color:#f8fafc;box-shadow:0 8px 24px #0008;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #mobile-keyboard-button svg,#mobile-pointer-button svg,#mobile-clipboard-button svg{display:block;width:20px;height:20px}
    #mobile-keyboard #mobile-keyboard-button{position:relative;padding:0;appearance:none;-webkit-appearance:none;line-height:0}
    #mobile-keyboard-button .keyboard-icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
    #mobile-keyboard-input{position:fixed;left:50%;bottom:0;width:1px;height:1px;opacity:.01;border:0;padding:0;pointer-events:none;clip-path:inset(50%)}
    #mobile-pointer-menu{position:absolute;right:52px;bottom:58px;display:grid;min-width:248px;overflow:hidden;border:1px solid #ffffff24;border-radius:18px;background:#15171bf2;box-shadow:0 18px 46px #000b;backdrop-filter:blur(18px)}
    #mobile-pointer-menu[hidden]{display:none}
    #mobile-pointer-menu button{display:grid;grid-template-columns:22px 24px 1fr;align-items:center;gap:10px;min-height:58px;border:0;padding:0 16px;background:transparent;color:#f8fafc;font:650 15px/1.2 system-ui,-apple-system,sans-serif;text-align:left;touch-action:manipulation}
    #mobile-pointer-menu button+button{border-top:1px solid #ffffff16}
    #mobile-pointer-menu button:active{background:#ffffff12}
    #mobile-pointer-menu svg{width:22px;height:22px}
    #trackpad-mode-check{visibility:hidden;font-size:20px;text-align:center}
    #trackpad-mode-toggle[aria-checked="true"] #trackpad-mode-check{visibility:visible}
    #mobile-pointer-button[aria-pressed="true"]{background:#1e3a5fe8;border-color:#93c5fd55}
    #mobile-trackpad-surface{position:fixed;z-index:15;inset:0;background:transparent;touch-action:none;-webkit-user-select:none;user-select:none}
    #mobile-trackpad-surface[hidden]{display:none}
    #mobile-trackpad-pointer{position:fixed;z-index:18;left:0;top:0;width:28px;height:28px;pointer-events:none;will-change:transform;filter:drop-shadow(0 2px 3px #000b)}
    #mobile-trackpad-pointer[hidden]{display:none}
    #mobile-trackpad-pointer svg{display:block;width:28px;height:28px;overflow:visible}
    #mobile-clipboard{position:fixed;z-index:22;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:none;font-family:system-ui,-apple-system,sans-serif}
    #mobile-clipboard-menu{position:absolute;left:0;bottom:58px;display:grid;min-width:224px;overflow:hidden;border:1px solid #ffffff24;border-radius:18px;background:#15171bf2;box-shadow:0 18px 46px #000b;backdrop-filter:blur(18px)}
    #mobile-clipboard-menu[hidden]{display:none}
    #mobile-clipboard-menu button{display:flex;align-items:center;gap:13px;min-height:58px;border:0;padding:0 17px;background:transparent;color:#f8fafc;font:650 15px/1.2 system-ui,-apple-system,sans-serif;text-align:left;touch-action:manipulation}
    #mobile-clipboard-menu button+button{border-top:1px solid #ffffff16}
    #mobile-clipboard-menu button:active{background:#ffffff12}
    #mobile-clipboard-menu svg{width:22px;height:22px;flex:none}
    #mobile-keyboard-button:hover,#mobile-keyboard-button:focus-visible,#mobile-pointer-button:hover,#mobile-pointer-button:focus-visible,#mobile-clipboard-button:hover,#mobile-clipboard-button:focus-visible{background:#1e293be8;color:#fff;outline:none}
    #mobile-keyboard-button:active,#mobile-pointer-button:active,#mobile-clipboard-button:active{transform:scale(.96)}
    #mobile-action-toast{position:fixed;z-index:40;left:50%;bottom:max(78px,calc(env(safe-area-inset-bottom) + 70px));max-width:calc(100vw - 32px);transform:translateX(-50%);padding:9px 13px;border:1px solid #ffffff24;border-radius:999px;background:#0f172af2;color:#f8fafc;box-shadow:0 10px 28px #000a;font:700 12px/1.2 system-ui,-apple-system,sans-serif;white-space:nowrap}
    #mobile-action-toast[hidden]{display:none}
    @media (pointer:fine) and (min-width:900px){#agent-command-header,#mobile-keyboard{opacity:.82}#agent-command-header:hover,#agent-command-header:focus-within,#mobile-keyboard:hover,#mobile-keyboard:focus-within{opacity:1}#mobile-pointer-button,#mobile-pointer-menu{display:none}}
    @media (max-width:720px){#mobile-clipboard{display:block}}
    @media (max-width:480px){#agent-command-header{left:8px;right:8px;width:auto;transform:none}#agent-header-toggle{background:transparent!important;box-shadow:none;-webkit-tap-highlight-color:transparent}#agent-command-header[data-collapsed="true"]{left:50%;right:auto;width:min(340px,calc(100vw - 32px));transform:translateX(-50%)}#agent-command-header[data-collapsed="true"] #agent-status{column-gap:12px;padding:11px 52px 11px 15px}#agent-command-header[data-collapsed="true"] #agent-status-state{align-self:center}#agent-command-header[data-collapsed="true"] #agent-header-toggle{right:4px;top:50%;bottom:auto;width:40px;height:40px;background:transparent!important;box-shadow:none;-webkit-tap-highlight-color:transparent;transform:translateY(-50%) rotate(180deg)}#screen-switcher a{min-height:48px;padding:6px 10px}#agent-status{padding:11px 12px 13px}#agent-status-role{display:block;margin:3px 0 0}}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header id="agent-command-header" data-state="offline" data-connection="reconnecting" data-collapsed="false">
    <nav id="screen-switcher" aria-label="Switch agent screen">
      <a href="/screen/1/" data-screen="1" data-agent="Iris" data-agent-name="Iris" data-agent-role="Chief of Staff">
        <span class="screen-link-dot" aria-hidden="true"></span>
        <span class="screen-link-name">IRIS · S1</span>
        <span class="screen-link-role">Chief of Staff</span>
      </a>
      <a href="/screen/2/" data-screen="2" data-agent="Tara" data-agent-name="Tara" data-agent-role="Recruitment Agent">
        <span class="screen-link-dot" aria-hidden="true"></span>
        <span class="screen-link-name">TARA · S2</span>
        <span class="screen-link-role">Recruitment Agent</span>
      </a>
      <a href="/screen/3/" data-screen="3" data-agent="Atlas" data-agent-name="Atlas" data-agent-role="GBAsset &amp; EasyDCIM Agent">
        <span class="screen-link-dot" aria-hidden="true"></span>
        <span class="screen-link-name">ATLAS · S3</span>
        <span class="screen-link-role">GBAsset &amp; EasyDCIM Agent</span>
      </a>
      <a href="/screen/4/" data-screen="4" data-agent="Mira" data-agent-name="Mira" data-agent-role="Product Design &amp; UX Agent">
        <span class="screen-link-dot" aria-hidden="true"></span>
        <span class="screen-link-name">MIRA · S4</span>
        <span class="screen-link-role">Product Design &amp; UX Agent</span>
      </a>
    </nav>

    <aside id="agent-status" aria-live="polite">
      <span id="agent-status-dot" aria-hidden="true"></span>
      <div id="agent-status-identity"><span id="agent-status-name">Agent</span><span id="agent-status-role">Role</span></div>
      <span id="agent-status-state">Offline</span>
      <div id="agent-status-task">Status unavailable</div>
      <div id="agent-status-meta">
        <span id="agent-status-activity">Updated time unavailable</span>
        <span id="screen-connection"><span id="screen-connection-state">Reconnecting</span></span>
      </div>
    </aside>
    <button id="agent-header-toggle" type="button" aria-label="Collapse agent header" aria-expanded="true">⌃</button>
  </header>

  <div id="mobile-keyboard" aria-label="Remote keyboard controls">
    <input id="mobile-keyboard-input" class="remote-keyboard-capture" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type on remote screen">
    <div id="mobile-pointer-menu" role="menu" aria-label="Pointer controls" hidden>
      <button id="trackpad-mode-toggle" type="button" role="menuitemcheckbox" aria-checked="false">
        <span id="trackpad-mode-check" aria-hidden="true">✓</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-7 1-4 7z"/><path d="m13 13 4 6"/></svg>
        <span>Trackpad mode</span>
      </button>
      <button id="recenter-pointer" type="button" role="menuitem">
        <span aria-hidden="true"></span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span>Recenter pointer</span>
      </button>
    </div>
    <button id="mobile-pointer-button" type="button" aria-label="Open pointer controls" aria-haspopup="menu" aria-expanded="false" aria-pressed="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <button id="mobile-keyboard-button" data-icon="keyboard" type="button" aria-label="Open mobile keyboard" aria-expanded="false">
      <svg class="keyboard-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 8h.01M12 12h.01M14 8h.01M16 12h.01M18 8h.01M6 8h.01M7 16h10M8 12h.01"/>
        <rect width="20" height="16" x="2" y="4" rx="2"/>
      </svg>
    </button>
  </div>
  <div id="mobile-trackpad-surface" aria-label="Trackpad surface" hidden></div>
  <div id="mobile-trackpad-pointer" aria-hidden="true" hidden>
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 2.5 22.4 15l-8.1 1.5-4.2 7.1L3 2.5Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="mobile-clipboard">
    <div id="mobile-clipboard-menu" role="menu" aria-label="Phone clipboard" hidden>
      <button id="paste-from-phone" type="button" role="menuitem">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 14h10M16 4h2a2 2 0 0 1 2 2v1.3m9.7 13.6A2 2 0 0 1 18 22H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m17 18 4-4-4-4"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        <span>Paste from phone</span>
      </button>
      <button id="copy-to-phone" type="button" role="menuitem">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span>Copy to phone</span>
      </button>
    </div>
    <button id="mobile-clipboard-button" data-icon="clipboard-paste" type="button" aria-label="Open phone clipboard" aria-haspopup="menu" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 14h10"/>
        <path d="M16 4h2a2 2 0 0 1 2 2v1.344"/>
        <path class="clipboard-paste-arrow" d="m17 18 4-4-4-4"/>
        <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"/>
        <rect x="8" y="2" width="8" height="4" rx="1"/>
      </svg>
    </button>
  </div>
  <div id="mobile-action-toast" role="status" aria-live="polite" hidden></div>

<script type="module">
  import RFB from "./core/rfb.js";

  const match = location.pathname.match(/^\/screen\/([1-4])\/?$/);
  if (!match) throw new Error("Invalid screen path");

  const screenNumber = match[1];
  const activeScreenLink = document.querySelector(`#screen-switcher [data-screen="${screenNumber}"]`);
  if (!activeScreenLink) throw new Error("Unknown agent screen");
  activeScreenLink.setAttribute("aria-current", "page");
  const activeAgent = {
    name: activeScreenLink.dataset.agentName,
    role: activeScreenLink.dataset.agentRole,
  };
  document.title = `${activeAgent.name} · Agent Screen`;

  const socketURL = `wss://${location.host}/screen/${screenNumber}/websockify`;
  const commandHeader = document.getElementById("agent-command-header");
  const headerToggle = document.getElementById("agent-header-toggle");
  const keyboardButton = document.getElementById("mobile-keyboard-button");
  const keyboardInput = document.getElementById("mobile-keyboard-input");
  const pointerButton = document.getElementById("mobile-pointer-button");
  const pointerMenu = document.getElementById("mobile-pointer-menu");
  const trackpadModeToggle = document.getElementById("trackpad-mode-toggle");
  const recenterPointerButton = document.getElementById("recenter-pointer");
  const trackpadSurface = document.getElementById("mobile-trackpad-surface");
  const pointerVisual = document.getElementById("mobile-trackpad-pointer");
  const clipboardButton = document.getElementById("mobile-clipboard-button");
  const clipboardMenu = document.getElementById("mobile-clipboard-menu");
  const pasteFromPhoneButton = document.getElementById("paste-from-phone");
  const copyToPhoneButton = document.getElementById("copy-to-phone");
  const mobileActionToast = document.getElementById("mobile-action-toast");
  const agentStatusName = document.getElementById("agent-status-name");
  const agentStatusRole = document.getElementById("agent-status-role");
  const agentStatusState = document.getElementById("agent-status-state");
  const agentStatusTask = document.getElementById("agent-status-task");
  const agentStatusActivity = document.getElementById("agent-status-activity");
  const screenConnectionState = document.getElementById("screen-connection-state");
  const statusLabels = {
    idle: "Ready",
    working: "Working",
    waiting_approval: "Waiting for Boss",
    error: "Attention",
    offline: "Offline",
  };
  const KEYBOARD_SENTINEL = "\u200b";
  const REMOTE_CLIPBOARD_TIMEOUT_MS = 2500;
  const TRACKPAD_MIN_GAIN = 0.72;
  const TRACKPAD_MAX_GAIN = 1.15;
  const TRACKPAD_TAP_MOVE_PX = 8;
  const TRACKPAD_DOUBLE_TAP_MS = 360;
  const TRACKPAD_HOLD_MS = 180;
  const remoteClipboardWaiters = new Set();
  let rfb = null;
  let reconnectTimer = null;
  let collapseTimer = null;
  let toastTimer = null;
  let composing = false;
  let remoteClipboardText = "";
  let trackpadEnabled = false;
  let trackpadPointer = { x: 0, y: 0 };
  let trackpadGesture = null;
  let trackpadLastTapAt = 0;
  let trackpadHoldTimer = null;
  let trackpadDragging = false;
  let trackpadMoveFrame = null;
  let trackpadPendingDelta = { x: 0, y: 0 };
  let statusUpdatedAt = "";

  agentStatusName.textContent = activeAgent.name;
  agentStatusRole.textContent = activeAgent.role;

  function setConnectionState(state) {
    commandHeader.dataset.connection = state;
    screenConnectionState.textContent = state === "live" ? "Screen Live" : "Reconnecting";
  }

  function connect() {
    clearTimeout(reconnectTimer);
    setConnectionState("reconnecting");
    rfb = new RFB(document.body, socketURL);
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.showDotCursor = true;
    installDirectTouchGestureGuard();
    rfb.addEventListener("connect", () => setConnectionState("live"), { once: true });
    rfb.addEventListener("clipboard", event => {
      remoteClipboardText = event.detail.text || "";
      for (const waiter of [...remoteClipboardWaiters]) waiter(remoteClipboardText);
    });
    rfb.addEventListener("disconnect", () => {
      rfb = null;
      setConnectionState("reconnecting");
      reconnectTimer = setTimeout(connect, 2000);
    }, { once: true });
  }

  function relativeTime(value) {
    const timestamp = Date.parse(value);
    if (!Number.isFinite(timestamp)) return "Updated time unavailable";
    const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
    if (seconds < 15) return "Updated just now";
    if (seconds < 60) return `Updated ${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `Updated ${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `Updated ${hours}h ago`;
    return `Updated ${Math.floor(hours / 24)}d ago`;
  }

  function refreshRelativeTime() {
    agentStatusActivity.textContent = relativeTime(statusUpdatedAt);
  }

  function setAgentStatus(state, task, updatedAt = "") {
    const safeState = Object.hasOwn(statusLabels, state) ? state : "offline";
    commandHeader.dataset.state = safeState;
    agentStatusState.textContent = statusLabels[safeState];
    agentStatusTask.textContent = task || `${activeAgent.role} unavailable`;
    statusUpdatedAt = updatedAt;
    refreshRelativeTime();
  }

  async function refreshAgentStatus() {
    try {
      const response = await fetch(`/status/screen-${screenNumber}.json?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`status ${response.status}`);
      const payload = await response.json();
      if (payload.schema !== 1 || payload.screen !== Number(screenNumber) || payload.agent !== activeAgent.name) throw new Error("invalid status payload");
      setAgentStatus(payload.state, payload.task, payload.updated_at);
    } catch (_error) {
      setAgentStatus("offline", `${activeAgent.role} unavailable`);
    }
  }

  function setHeaderCollapsed(collapsed) {
    commandHeader.dataset.collapsed = String(collapsed);
    headerToggle.setAttribute("aria-expanded", String(!collapsed));
    headerToggle.setAttribute("aria-label", collapsed ? "Expand agent header" : "Collapse agent header");
  }

  function scheduleMobileCollapse() {
    clearTimeout(collapseTimer);
    if (!matchMedia("(max-width: 720px)").matches) return;
    collapseTimer = setTimeout(() => setHeaderCollapsed(true), 5000);
  }

  function sendText(text) {
    if (!rfb) return;
    for (const character of text) {
      const codepoint = character.codePointAt(0);
      const keysym = codepoint <= 0xff ? codepoint : 0x01000000 | codepoint;
      rfb.sendKey(keysym);
    }
  }

  function showMobileToast(message) {
    clearTimeout(toastTimer);
    mobileActionToast.textContent = message;
    mobileActionToast.hidden = false;
    toastTimer = setTimeout(() => { mobileActionToast.hidden = true; }, 1800);
  }

  function sendRemotePasteShortcut() {
    if (!rfb) return;
    rfb.sendKey(0xffe3, "ControlLeft", true);
    rfb.sendKey(0x0076, "KeyV", true);
    rfb.sendKey(0x0076, "KeyV", false);
    rfb.sendKey(0xffe3, "ControlLeft", false);
  }

  function pasteTextToRemote(text) {
    if (!rfb || !text) return false;
    rfb.clipboardPasteFrom(text);
    setTimeout(() => sendRemotePasteShortcut(), 60);
    return true;
  }

  function sendRemoteCopyShortcut() {
    if (!rfb) return;
    rfb.sendKey(0xffe3, "ControlLeft", true);
    rfb.sendKey(0x0063, "KeyC", true);
    rfb.sendKey(0x0063, "KeyC", false);
    rfb.sendKey(0xffe3, "ControlLeft", false);
  }

  function setClipboardMenuOpen(open) {
    clipboardMenu.hidden = !open;
    clipboardButton.setAttribute("aria-expanded", String(open));
    if (open) setPointerMenuOpen(false);
  }

  function setPointerMenuOpen(open) {
    pointerMenu.hidden = !open;
    pointerButton.setAttribute("aria-expanded", String(open));
    if (open) {
      clipboardMenu.hidden = true;
      clipboardButton.setAttribute("aria-expanded", "false");
    }
  }

  function remoteCanvas() {
    return document.querySelector("canvas");
  }

  function handleDirectDragGesture(event) {
    if (trackpadEnabled || event.detail?.type !== "drag") return;
    event.stopImmediatePropagation();
    event.preventDefault();
    const canvas = remoteCanvas();
    if (!canvas || !rfb) return;
    const rect = canvas.getBoundingClientRect();
    trackpadPointer = {
      x: Math.min(rect.right - 1, Math.max(rect.left + 1, event.detail.clientX)),
      y: Math.min(rect.bottom - 1, Math.max(rect.top + 1, event.detail.clientY)),
    };
    const position = trackpadCanvasPosition(canvas);
    rfb?._handleMouseMove(position.x, position.y);
    rfb?._cursor?.move(trackpadPointer.x, trackpadPointer.y);
  }

  function installDirectTouchGestureGuard() {
    const canvas = remoteCanvas();
    if (!canvas) return;
    for (const eventName of ["gesturestart", "gesturemove", "gestureend"]) {
      canvas.addEventListener(eventName, handleDirectDragGesture, { capture: true });
    }
  }

  function clampTrackpadPointer() {
    const canvas = remoteCanvas();
    if (!canvas) return null;
    const rect = canvas.getBoundingClientRect();
    if (!trackpadPointer.x && !trackpadPointer.y) {
      trackpadPointer = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }
    trackpadPointer.x = Math.min(rect.right - 1, Math.max(rect.left + 1, trackpadPointer.x));
    trackpadPointer.y = Math.min(rect.bottom - 1, Math.max(rect.top + 1, trackpadPointer.y));
    return canvas;
  }

  function updateTrackpadPointerVisual() {
    pointerVisual.style.transform = `translate3d(${Math.round(trackpadPointer.x - 3)}px,${Math.round(trackpadPointer.y - 3)}px,0)`;
  }

  function trackpadCanvasPosition(canvas) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: trackpadPointer.x - rect.left,
      y: trackpadPointer.y - rect.top,
    };
  }

  function dispatchTrackpadMouse(type, button = 0, buttons = 0) {
    const canvas = clampTrackpadPointer();
    if (!canvas || !rfb) return false;
    const position = trackpadCanvasPosition(canvas);
    if (type === "mousemove") {
      rfb?._handleMouseMove(position.x, position.y);
    } else {
      const pressedMask = button === 2 ? 4 : button === 1 ? 2 : 1;
      const mask = type === "mousedown" ? pressedMask : 0;
      rfb?._handleMouseButton(position.x, position.y, mask);
    }
    updateTrackpadPointerVisual();
    rfb?._cursor?.move(trackpadPointer.x, trackpadPointer.y);
    return true;
  }

  function flushTrackpadMove() {
    trackpadMoveFrame = null;
    const deltaX = trackpadPendingDelta.x;
    const deltaY = trackpadPendingDelta.y;
    trackpadPendingDelta = { x: 0, y: 0 };
    const distance = Math.hypot(deltaX, deltaY);
    if (!distance) return;
    const gain = Math.min(TRACKPAD_MAX_GAIN, TRACKPAD_MIN_GAIN + (distance / 24) * (TRACKPAD_MAX_GAIN - TRACKPAD_MIN_GAIN));
    trackpadPointer.x += deltaX * gain;
    trackpadPointer.y += deltaY * gain;
    dispatchTrackpadMouse("mousemove", 0, trackpadDragging ? 1 : 0);
  }

  function queueTrackpadMove(deltaX, deltaY) {
    trackpadPendingDelta.x += deltaX;
    trackpadPendingDelta.y += deltaY;
    if (trackpadMoveFrame === null) trackpadMoveFrame = requestAnimationFrame(flushTrackpadMove);
  }

  function flushPendingTrackpadMove() {
    if (trackpadMoveFrame !== null) {
      cancelAnimationFrame(trackpadMoveFrame);
      trackpadMoveFrame = null;
    }
    flushTrackpadMove();
  }

  function dispatchTrackpadWheel(deltaX, deltaY) {
    const canvas = clampTrackpadPointer();
    if (!canvas || !rfb) return;
    rfb?._handleWheel({
      stopPropagation() {},
      preventDefault() {},
      clientX: trackpadPointer.x,
      clientY: trackpadPointer.y,
      buttons: 0,
      deltaX,
      deltaY,
      deltaMode: 0,
    });
  }

  function recenterTrackpadPointer() {
    const canvas = remoteCanvas();
    if (!canvas) {
      showMobileToast("Screen is reconnecting");
      return;
    }
    if (trackpadMoveFrame !== null) cancelAnimationFrame(trackpadMoveFrame);
    trackpadMoveFrame = null;
    trackpadPendingDelta = { x: 0, y: 0 };
    const rect = canvas.getBoundingClientRect();
    trackpadPointer = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    dispatchTrackpadMouse("mousemove");
    setPointerMenuOpen(false);
    showMobileToast("Pointer recentered");
  }

  function setTrackpadMode(enabled) {
    if (!enabled) {
      clearTrackpadHold();
      flushPendingTrackpadMove();
      if (trackpadDragging) dispatchTrackpadMouse("mouseup", 0, 0);
      trackpadDragging = false;
      trackpadGesture = null;
    }
    trackpadEnabled = enabled;
    trackpadSurface.hidden = !enabled;
    pointerVisual.hidden = !enabled;
    trackpadModeToggle.setAttribute("aria-checked", String(enabled));
    pointerButton.setAttribute("aria-pressed", String(enabled));
    setPointerMenuOpen(false);
    if (enabled) {
      clampTrackpadPointer();
      dispatchTrackpadMouse("mousemove");
      showMobileToast("Trackpad mode on · swipe anywhere");
    } else {
      showMobileToast("Direct touch mode");
    }
  }

  function showKeyboardPasteFallback() {
    openKeyboard();
    showMobileToast("Long-press field and Paste");
  }

  async function pasteDeviceClipboard() {
    setClipboardMenuOpen(false);
    if (!rfb) {
      showMobileToast("Screen is reconnecting");
      return;
    }
    if (!navigator.clipboard?.readText) {
      showKeyboardPasteFallback();
      return;
    }
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        showMobileToast("Clipboard is empty");
        return;
      }
      pasteTextToRemote(text);
      showMobileToast("Pasted to screen");
    } catch (_error) {
      showKeyboardPasteFallback();
    }
  }

  function waitForRemoteClipboardText() {
    return new Promise((resolve, reject) => {
      let timer = null;
      const waiter = text => {
        if (!remoteClipboardWaiters.delete(waiter)) return;
        clearTimeout(timer);
        if (text) resolve(text); else reject(new Error("remote-clipboard-empty"));
      };
      remoteClipboardWaiters.add(waiter);
      timer = setTimeout(() => {
        remoteClipboardWaiters.delete(waiter);
        reject(new Error("remote-clipboard-timeout"));
      }, REMOTE_CLIPBOARD_TIMEOUT_MS);
    });
  }

  async function copyRemoteClipboardToPhone() {
    setClipboardMenuOpen(false);
    if (!rfb) {
      showMobileToast("Screen is reconnecting");
      return;
    }
    const textPromise = waitForRemoteClipboardText();
    showMobileToast("Copying remote selection…");
    try {
      if (navigator.clipboard?.write && typeof ClipboardItem === "function") {
        const clipboardItem = new ClipboardItem({
          "text/plain": textPromise.then(text => new Blob([text], { type: "text/plain" })),
        });
        const writePromise = navigator.clipboard.write([clipboardItem]);
        sendRemoteCopyShortcut();
        await writePromise;
      } else if (navigator.clipboard?.writeText) {
        sendRemoteCopyShortcut();
        const text = await textPromise;
        await navigator.clipboard.writeText(text);
      } else {
        remoteClipboardWaiters.clear();
        showMobileToast("Phone clipboard unavailable");
        return;
      }
      showMobileToast("Copied to phone");
    } catch (error) {
      if (error?.message?.startsWith("remote-clipboard-")) {
        showMobileToast("Remote clipboard did not update");
      } else {
        showMobileToast("Allow clipboard access and retry");
      }
    }
  }

  function resetKeyboardInput() {
    keyboardInput.value = KEYBOARD_SENTINEL;
    keyboardInput.setSelectionRange(KEYBOARD_SENTINEL.length, KEYBOARD_SENTINEL.length);
  }

  function sendRemoteBackspace() {
    rfb?.sendKey(0xff08, "Backspace");
  }

  function dismissNativeKeyboardForClipboard() {
    if (document.activeElement === keyboardInput) keyboardInput.blur();
    keyboardButton.setAttribute("aria-expanded", "false");
    window.getSelection()?.removeAllRanges();
  }

  function openKeyboard() {
    keyboardButton.setAttribute("aria-expanded", "true");
    resetKeyboardInput();
    keyboardInput.focus({ preventScroll: true });
    resetKeyboardInput();
  }

  function closeKeyboard() {
    keyboardInput.value = "";
    keyboardInput.blur();
    keyboardButton.setAttribute("aria-expanded", "false");
    rfb?.focus({ preventScroll: true });
  }

  function clearTrackpadHold() {
    clearTimeout(trackpadHoldTimer);
    trackpadHoldTimer = null;
  }

  function touchCenter(touches) {
    const points = [...touches];
    return {
      x: points.reduce((sum, touch) => sum + touch.clientX, 0) / points.length,
      y: points.reduce((sum, touch) => sum + touch.clientY, 0) / points.length,
    };
  }

  function handleTrackpadTouchStart(event) {
    event.preventDefault();
    clearTrackpadHold();
    if (event.touches.length === 1) {
      const touch = event.touches[0];
      const isDoubleTap = Date.now() - trackpadLastTapAt <= TRACKPAD_DOUBLE_TAP_MS;
      trackpadGesture = {
        kind: "single",
        startX: touch.clientX,
        startY: touch.clientY,
        lastX: touch.clientX,
        lastY: touch.clientY,
        moved: false,
        isDoubleTap,
      };
      if (isDoubleTap) {
        trackpadHoldTimer = setTimeout(() => {
          if (!trackpadGesture || trackpadGesture.moved) return;
          trackpadDragging = true;
          dispatchTrackpadMouse("mousedown", 0, 1);
        }, TRACKPAD_HOLD_MS);
      }
    } else if (event.touches.length === 2) {
      const center = touchCenter(event.touches);
      trackpadGesture = {
        kind: "two",
        startX: center.x,
        startY: center.y,
        lastX: center.x,
        lastY: center.y,
        moved: false,
      };
    }
  }

  function handleTrackpadTouchMove(event) {
    event.preventDefault();
    if (!trackpadGesture) return;
    if (trackpadGesture.kind === "single" && event.touches.length === 1) {
      const touch = event.touches[0];
      const dx = touch.clientX - trackpadGesture.lastX;
      const dy = touch.clientY - trackpadGesture.lastY;
      if (Math.hypot(touch.clientX - trackpadGesture.startX, touch.clientY - trackpadGesture.startY) > TRACKPAD_TAP_MOVE_PX) {
        trackpadGesture.moved = true;
        if (!trackpadDragging) clearTrackpadHold();
      }
      trackpadGesture.lastX = touch.clientX;
      trackpadGesture.lastY = touch.clientY;
      queueTrackpadMove(dx, dy);
    } else if (trackpadGesture.kind === "two" && event.touches.length === 2) {
      const center = touchCenter(event.touches);
      const dx = center.x - trackpadGesture.lastX;
      const dy = center.y - trackpadGesture.lastY;
      if (Math.hypot(center.x - trackpadGesture.startX, center.y - trackpadGesture.startY) > TRACKPAD_TAP_MOVE_PX) {
        trackpadGesture.moved = true;
      }
      trackpadGesture.lastX = center.x;
      trackpadGesture.lastY = center.y;
      dispatchTrackpadWheel(-dx * 2.2, -dy * 2.2);
    }
  }

  function finishTrackpadTouch(cancelled = false) {
    clearTrackpadHold();
    flushPendingTrackpadMove();
    if (!trackpadGesture) return;
    if (trackpadDragging) {
      dispatchTrackpadMouse("mouseup", 0, 0);
      trackpadDragging = false;
    } else if (!cancelled && trackpadGesture.kind === "two" && !trackpadGesture.moved) {
      dispatchTrackpadMouse("mousedown", 2, 2);
      dispatchTrackpadMouse("mouseup", 2, 0);
    } else if (!cancelled && trackpadGesture.kind === "single" && !trackpadGesture.moved) {
      dispatchTrackpadMouse("mousedown", 0, 1);
      dispatchTrackpadMouse("mouseup", 0, 0);
      trackpadLastTapAt = trackpadGesture.isDoubleTap ? 0 : Date.now();
    }
    trackpadGesture = null;
  }

  function handleTrackpadTouchEnd(event) {
    event.preventDefault();
    if (event.touches.length === 0) finishTrackpadTouch(false);
  }

  headerToggle.addEventListener("click", () => {
    const collapsed = commandHeader.dataset.collapsed === "true";
    setHeaderCollapsed(!collapsed);
    if (collapsed) scheduleMobileCollapse();
  });
  keyboardButton.addEventListener("click", () => {
    setPointerMenuOpen(false);
    if (document.activeElement === keyboardInput) closeKeyboard(); else openKeyboard();
  });
  pointerButton.addEventListener("pointerdown", dismissNativeKeyboardForClipboard);
  pointerButton.addEventListener("click", () => setPointerMenuOpen(pointerMenu.hidden));
  trackpadModeToggle.addEventListener("click", () => setTrackpadMode(!trackpadEnabled));
  recenterPointerButton.addEventListener("click", recenterTrackpadPointer);
  trackpadSurface.addEventListener("touchstart", handleTrackpadTouchStart, { passive: false });
  trackpadSurface.addEventListener("touchmove", handleTrackpadTouchMove, { passive: false });
  trackpadSurface.addEventListener("touchend", handleTrackpadTouchEnd, { passive: false });
  trackpadSurface.addEventListener("touchcancel", event => {
    event.preventDefault();
    finishTrackpadTouch(true);
  }, { passive: false });
  clipboardButton.addEventListener("pointerdown", dismissNativeKeyboardForClipboard);
  clipboardButton.addEventListener("click", () => setClipboardMenuOpen(clipboardMenu.hidden));
  pasteFromPhoneButton.addEventListener("click", pasteDeviceClipboard);
  copyToPhoneButton.addEventListener("click", copyRemoteClipboardToPhone);
  document.addEventListener("pointerdown", event => {
    if (!event.target.closest("#mobile-clipboard")) setClipboardMenuOpen(false);
    if (!event.target.closest("#mobile-keyboard")) setPointerMenuOpen(false);
  });
  keyboardInput.addEventListener("blur", () => keyboardButton.setAttribute("aria-expanded", "false"));
  keyboardInput.addEventListener("compositionstart", () => { composing = true; });
  keyboardInput.addEventListener("compositionend", () => {
    composing = false;
    const text = keyboardInput.value.replaceAll(KEYBOARD_SENTINEL, "");
    if (text) sendText(text);
    resetKeyboardInput();
  });
  keyboardInput.addEventListener("beforeinput", event => {
    if (event.inputType !== "deleteContentBackward") return;
    event.preventDefault();
    sendRemoteBackspace();
    resetKeyboardInput();
  });
  keyboardInput.addEventListener("input", () => {
    if (composing) return;
    const text = keyboardInput.value.replaceAll(KEYBOARD_SENTINEL, "");
    if (text) sendText(text);
    resetKeyboardInput();
  });
  keyboardInput.addEventListener("keydown", event => {
    if (event.key === "Backspace") {
      event.preventDefault();
      sendRemoteBackspace();
      resetKeyboardInput();
      return;
    }
    const special = { Enter: [0xff0d, "Enter"], Tab: [0xff09, "Tab"], Escape: [0xff1b, "Escape"] }[event.key];
    if (!special) return;
    event.preventDefault();
    rfb?.sendKey(special[0], special[1]);
  });

  refreshAgentStatus();
  setInterval(refreshAgentStatus, 5000);
  setInterval(refreshRelativeTime, 15000);
  scheduleMobileCollapse();
  connect();
</script>
</body>
</html>
