<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1e2330">
  <title>Screen</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1e2330}
    body{display:flex}
    canvas{outline:none}
    #screen-switcher{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border:1px solid #ffffff2c;border-radius:15px;background:#0f172ad9;box-shadow:0 10px 28px #0008;backdrop-filter:blur(12px);font:700 13px/1 system-ui,-apple-system,sans-serif}
    #screen-switcher a{display:flex;align-items:center;justify-content:center;gap:7px;min-width:94px;min-height:44px;padding:0 14px;border-radius:11px;color:#cbd5e1;text-decoration:none;white-space:nowrap;touch-action:manipulation;transition:background .15s,color .15s,box-shadow .15s}
    #screen-switcher a::before{content:"";width:7px;height:7px;border-radius:50%;background:#64748b;box-shadow:0 0 0 3px #64748b22}
    #screen-switcher a:hover,#screen-switcher a:focus-visible{background:#ffffff12;color:#fff;outline:none}
    #screen-switcher a[aria-current="page"]{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 6px 18px #2563eb55}
    #screen-switcher a[aria-current="page"]::before{background:#bfdbfe;box-shadow:0 0 0 3px #bfdbfe2e}
    #agent-status{position:fixed;z-index:29;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:grid;grid-template-columns:10px auto;column-gap:9px;row-gap:3px;align-items:center;max-width:min(320px,calc(100vw - 24px));padding:10px 13px;border:1px solid #ffffff2c;border-radius:14px;background:#0f172ae8;color:#f8fafc;box-shadow:0 10px 28px #0008;backdrop-filter:blur(12px);font-family:system-ui,-apple-system,sans-serif}
    #agent-status[hidden]{display:none}
    #agent-status-dot{grid-row:1/3;width:9px;height:9px;border-radius:50%;background:#64748b;box-shadow:0 0 0 4px #64748b24}
    #agent-status-name{font-size:13px;font-weight:750;line-height:1.15;white-space:nowrap}
    #agent-status-state{margin-left:5px;color:#94a3b8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    #agent-status-task{overflow:hidden;color:#cbd5e1;font-size:12px;font-weight:550;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
    #agent-status[data-state="working"] #agent-status-dot{background:#22c55e;box-shadow:0 0 0 4px #22c55e24}
    #agent-status[data-state="idle"] #agent-status-dot{background:#3b82f6;box-shadow:0 0 0 4px #3b82f624}
    #agent-status[data-state="waiting_approval"] #agent-status-dot{background:#f59e0b;box-shadow:0 0 0 4px #f59e0b24}
    #agent-status[data-state="error"] #agent-status-dot{background:#ef4444;box-shadow:0 0 0 4px #ef444424}
    #mobile-keyboard{position:fixed;z-index:20;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;font:600 14px/1 system-ui,-apple-system,sans-serif}
    #mobile-keyboard button{min-height:44px;border:1px solid #ffffff2c;border-radius:12px;padding:0 14px;background:#111827e8;color:#f8fafc;box-shadow:0 8px 24px #0008;touch-action:manipulation}
    #mobile-keyboard-button{font-size:18px;min-width:48px;padding:0 12px}
    #mobile-keyboard-panel{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #ffffff2c;border-radius:14px;background:#0f172aeF;box-shadow:0 10px 30px #0009}
    #mobile-keyboard-panel[hidden]{display:none}
    #mobile-keyboard-input{width:min(56vw,280px);height:44px;border:1px solid #64748b;border-radius:10px;padding:0 12px;background:#f8fafc;color:#0f172a;font:500 16px/1 system-ui,-apple-system,sans-serif;outline:none}
    #mobile-keyboard-input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f633}
    @media (pointer:fine) and (min-width:900px){#screen-switcher,#agent-status,#mobile-keyboard{opacity:.78;transition:opacity .15s}#screen-switcher:hover,#screen-switcher:focus-within,#agent-status:hover,#mobile-keyboard:hover,#mobile-keyboard:focus-within{opacity:1}}
    @media (max-width:720px){#agent-status{top:calc(max(8px,env(safe-area-inset-top)) + 58px);right:50%;width:min(360px,calc(100vw - 20px));transform:translateX(50%)}}
    @media (max-width:480px){#screen-switcher{top:max(8px,env(safe-area-inset-top));padding:3px;border-radius:14px}#screen-switcher a{min-width:84px;min-height:44px;padding:0 11px;font-size:12px}}
  </style>
</head>
<body>
  <nav id="screen-switcher" aria-label="Switch agent screen">
    <a href="/screen/1/" data-screen="1">Screen 1</a>
    <a href="/screen/2/" data-screen="2">Screen 2</a>
  </nav>

  <aside id="agent-status" data-agent="Tara" data-state="offline" aria-live="polite" hidden>
    <span id="agent-status-dot" aria-hidden="true"></span>
    <div id="agent-status-name">Tara <span id="agent-status-state">Offline</span></div>
    <div id="agent-status-task">Recruitment Agent unavailable</div>
  </aside>

  <div id="mobile-keyboard" aria-label="Remote keyboard controls">
    <div id="mobile-keyboard-panel" hidden>
      <input id="mobile-keyboard-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type on remote screen" placeholder="Type on remote…">
      <button id="mobile-keyboard-done" type="button">Done</button>
    </div>
    <button id="mobile-keyboard-button" type="button" aria-label="Open mobile keyboard" aria-expanded="false">⌨</button>
  </div>

<script type="module">
  import RFB from "./core/rfb.js";

  const match = location.pathname.match(/^\/screen\/([12])\/?$/);
  if (!match) throw new Error("Invalid screen path");

  const screenNumber = match[1];
  const activeScreenLink = document.querySelector(`#screen-switcher [data-screen="${screenNumber}"]`);
  activeScreenLink?.setAttribute("aria-current", "page");
  document.title = `Screen ${screenNumber}`;
  const socketURL = `wss://${location.host}/screen/${screenNumber}/websockify`;
  const keyboardButton = document.getElementById("mobile-keyboard-button");
  const keyboardPanel = document.getElementById("mobile-keyboard-panel");
  const keyboardInput = document.getElementById("mobile-keyboard-input");
  const keyboardDone = document.getElementById("mobile-keyboard-done");
  const agentStatus = document.getElementById("agent-status");
  const agentStatusState = document.getElementById("agent-status-state");
  const agentStatusTask = document.getElementById("agent-status-task");
  const statusLabels = {
    idle: "Idle",
    working: "Working",
    waiting_approval: "Waiting for Boss",
    error: "Attention",
    offline: "Offline",
  };
  let rfb = null;
  let reconnectTimer = null;
  let composing = false;

  function connect() {
    clearTimeout(reconnectTimer);
    rfb = new RFB(document.body, socketURL);
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.showDotCursor = true;
    rfb.addEventListener("disconnect", () => {
      rfb = null;
      reconnectTimer = setTimeout(connect, 2000);
    }, { once: true });
  }

  function setAgentStatus(state, task, updatedAt = "") {
    const safeState = Object.hasOwn(statusLabels, state) ? state : "offline";
    agentStatus.dataset.state = safeState;
    agentStatusState.textContent = statusLabels[safeState];
    agentStatusTask.textContent = task || "Recruitment Agent unavailable";
    agentStatus.title = updatedAt ? `Updated ${updatedAt}` : "Status unavailable";
  }

  async function refreshAgentStatus() {
    try {
      const response = await fetch(`/status/screen-${screenNumber}.json?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`status ${response.status}`);
      const payload = await response.json();
      if (payload.schema !== 1 || payload.screen !== 2 || payload.agent !== "Tara") throw new Error("invalid status payload");
      setAgentStatus(payload.state, payload.task, payload.updated_at);
    } catch (_error) {
      setAgentStatus("offline", "Recruitment Agent unavailable");
    }
  }

  function sendText(text) {
    if (!rfb) return;
    for (const character of text) {
      const codepoint = character.codePointAt(0);
      const keysym = codepoint <= 0xff ? codepoint : 0x01000000 | codepoint;
      rfb.sendKey(keysym);
    }
  }

  function openKeyboard() {
    keyboardPanel.hidden = false;
    keyboardButton.setAttribute("aria-expanded", "true");
    keyboardInput.focus({ preventScroll: true });
  }

  function closeKeyboard() {
    keyboardInput.value = "";
    keyboardPanel.hidden = true;
    keyboardButton.setAttribute("aria-expanded", "false");
    rfb?.focus({ preventScroll: true });
  }

  keyboardButton.addEventListener("click", () => {
    if (keyboardPanel.hidden) openKeyboard(); else closeKeyboard();
  });
  keyboardDone.addEventListener("click", closeKeyboard);
  keyboardInput.addEventListener("compositionstart", () => { composing = true; });
  keyboardInput.addEventListener("compositionend", () => {
    composing = false;
    sendText(keyboardInput.value);
    keyboardInput.value = "";
  });
  keyboardInput.addEventListener("beforeinput", event => {
    if (event.inputType === "deleteContentBackward") rfb?.sendKey(0xff08, "Backspace");
  });
  keyboardInput.addEventListener("input", () => {
    if (composing || !keyboardInput.value) return;
    sendText(keyboardInput.value);
    keyboardInput.value = "";
  });
  keyboardInput.addEventListener("keydown", event => {
    const special = { Enter: [0xff0d, "Enter"], Tab: [0xff09, "Tab"], Escape: [0xff1b, "Escape"] }[event.key];
    if (!special) return;
    event.preventDefault();
    rfb?.sendKey(special[0], special[1]);
  });

  if (screenNumber === "2") {
    agentStatus.hidden = false;
    refreshAgentStatus();
    setInterval(refreshAgentStatus, 5000);
  }
  connect();
</script>
</body>
</html>
