<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <title>Agent Screens</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080d19;
      color: #f4f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(70rem 34rem at 4% -8%, rgba(47, 112, 225, .27), transparent 58%),
        radial-gradient(42rem 28rem at 100% 100%, rgba(24, 75, 155, .11), transparent 60%),
        #080d19;
    }

    .shell {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: max(44px, env(safe-area-inset-top)) 28px max(36px, env(safe-area-inset-bottom));
    }

    .hero { margin-bottom: 30px; }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 58px);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 760;
    }

    .sub {
      margin: 12px 0 0;
      color: #9aa9c0;
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.55;
    }

    .summary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(117, 146, 191, .19);
      border-radius: 999px;
      background: rgba(17, 27, 47, .62);
      color: #b7c4d7;
      font-size: 13px;
      font-weight: 650;
    }

    .summary-dot,
    .dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #35d48a;
      box-shadow: 0 0 0 4px rgba(53, 212, 138, .11), 0 0 16px rgba(53, 212, 138, .35);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 250px;
      flex-direction: column;
      overflow: hidden;
      padding: 24px;
      border: 1px solid rgba(111, 142, 190, .22);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(18, 28, 48, .96), rgba(11, 18, 33, .96));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .26);
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: auto -70px -105px auto;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: rgba(65, 132, 244, .09);
      filter: blur(2px);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(93, 157, 255, .58);
      background: linear-gradient(145deg, rgba(20, 33, 57, .98), rgba(12, 21, 38, .98));
    }

    .card:focus-visible {
      outline: 3px solid rgba(88, 157, 255, .7);
      outline-offset: 3px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .screen-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(101, 160, 255, .24);
      border-radius: 13px;
      background: rgba(68, 130, 230, .11);
      color: #7db5ff;
    }

    .screen-icon svg { width: 22px; height: 22px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #8ddbb0;
      font-size: 13px;
      font-weight: 650;
    }

    .name {
      margin: 26px 0 7px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.025em;
      font-weight: 740;
    }

    .meta {
      color: #8f9fb8;
      font-size: 14px;
      line-height: 1.55;
    }

    .open {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 28px;
      color: #77adf8;
      font-weight: 700;
    }

    .arrow {
      display: inline-block;
      font-size: 20px;
      transition: transform .18s ease;
    }

    .card:hover .arrow { transform: translateX(4px); }

    footer {
      margin-top: 24px;
      color: #66748a;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 660px) {
      .shell {
        padding: max(30px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      }

      .hero { margin-bottom: 22px; }
      h1 { font-size: 40px; }
      .sub { margin-top: 9px; font-size: 16px; }
      .summary { margin-top: 15px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }

      .card {
        min-height: 0;
        padding: 20px;
        border-radius: 19px;
      }

      .name { margin-top: 22px; font-size: 26px; }
      .open { padding-top: 24px; }
      footer { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>Agent Screens</h1>
      <p class="sub">Choose a desktop to continue.</p>
      <div class="summary"><span class="summary-dot"></span>2 screens available</div>
    </header>

    <section class="grid" aria-label="Available desktops">
      <a class="card" href="/screen/1/" aria-label="Open Agent 1 desktop">
        <div class="card-top">
          <div class="screen-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <div class="status"><span class="dot"></span>Online</div>
        </div>
        <div class="name">Agent 1</div>
        <div class="meta">Chrome profile 1 · Shared workspace</div>
        <span class="open">Open desktop <span class="arrow">→</span></span>
      </a>

      <a class="card" href="/screen/2/" aria-label="Open Agent 2 desktop">
        <div class="card-top">
          <div class="screen-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <div class="status"><span class="dot"></span>Online</div>
        </div>
        <div class="name">Agent 2</div>
        <div class="meta">Chrome profile 2 · Shared workspace</div>
        <span class="open">Open desktop <span class="arrow">→</span></span>
      </a>
    </section>

    <footer>Persistent desktops · Shared workspace</footer>
  </main>
</body>
</html>
