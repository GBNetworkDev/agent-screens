version: 3
expires_after: 24h
idle_timeout: 24h

resources:
  apps:
    - executable: /opt/google/chrome/chrome
      launch: false
      windows: all
      terminate: driver_launched
    - executable: /usr/bin/google-chrome-stable
      launch: true
      windows: all
      terminate: driver_launched
    - executable: /usr/bin/xfce4-terminal
      launch: true
      windows: all
      terminate: driver_launched
    - executable: /usr/bin/thunar
      launch: true
      windows: all
      terminate: driver_launched
    - executable: /usr/bin/plank
      launch: false
      windows: all
      terminate: deny
    - executable: /usr/bin/xfwm4
      launch: false
      windows: all
      terminate: deny
  browser:
    profiles:
      - kind: isolated
  desktop:
    display: true
  files:
    read:
      - dir: /workspace
        recursive: true
      - dir: /tmp
        recursive: true
      - dir: /home/agent/Downloads
        recursive: true
    write:
      - dir: /workspace
        recursive: true
      - dir: /tmp
        recursive: true
      - dir: /home/agent/Downloads
        recursive: true
  computer_history:
    operations:
      - status
      - query

allow:
  tools:
    - list_apps
    - list_windows
    - get_window_state
    - verify_state
    - launch_app
    - kill_app
    - bring_to_front
    - set_window_frame
    - invoke_menu
    - click
    - double_click
    - right_click
    - drag
    - mouse_button_down
    - mouse_drag
    - mouse_button_up
    - parallel_mouse_drag
    - type_text
    - press_key
    - hotkey
    - set_value
    - scroll
    - clipboard_read
    - clipboard_write
    - get_screen_size
    - get_desktop_state
    - get_cursor_position
    - move_cursor
    - set_agent_cursor_enabled
    - set_agent_cursor_motion
    - get_agent_cursor_state
    - set_agent_cursor_theme
    - check_permissions
    - health_report
    - get_config
    - set_config
    - get_accessibility_tree
    - zoom
    - page
    - get_browser_state
    - browser_prepare
    - browser_navigate
    - browser_click
    - browser_type
    - browser_dialog
    - browser_set_input_files
    - browser_download
    - browser_pointer
    - start_recording
    - stop_recording
    - get_recording_state
    - replay_trajectory
    - install_ffmpeg
    - start_session
    - escalate_session
    - get_session
    - list_sessions
    - get_session_state
    - end_session
    - check_for_update
    - history_status
    - history_query
