server {
    listen 80;
    listen [::]:80;
    # Replace with the hostname that will serve Agent Screens.
    server_name screens.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 403;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name screens.example.com;

    ssl_certificate /etc/letsencrypt/live/screens.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screens.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AGENTSCREENSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    allow 127.0.0.1;
    allow ::1;
    # Replace this documentation-only address with your trusted VPN CIDR.
    allow 192.0.2.10;
    deny all;

    root /var/www/agent-screen;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "agent-screens ok\n";
    }

    location = /screen/1/ {
        root /var/www/agent-screen;
        try_files /viewer.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location /screen/1/core/ {
        alias /usr/share/novnc/core/;
    }

    location /screen/1/vendor/ {
        alias /usr/share/novnc/vendor/;
    }

    location = /screen/1/websockify {
        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /screen/2/ {
        root /var/www/agent-screen;
        try_files /viewer.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

