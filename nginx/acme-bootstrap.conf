server {
    listen 80;
    listen [::]:80;
    # Replace with the hostname that will serve Agent Screens.
    server_name screens.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 403;
    }
}
