server {
    listen 6080;
    listen [::]:6080;
    server_name _;

    allow 127.0.0.1;
    allow ::1;
    # Replace this documentation-only address with your trusted VPN CIDR.
    allow 192.0.2.10;
    deny all;

    root /var/www/agent-screen;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "agent-screen-router ok\n";
    }

    location = /screen/1/input-hit-test {
        proxy_pass http://127.0.0.1:6091/hit-test;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        add_header Cache-Control "no-store" always;
    }

    location /screen/1/ {
        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /screen/2/input-hit-test {
        proxy_pass http://127.0.0.1:6092/hit-test;
